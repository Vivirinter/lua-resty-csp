lua_package_path "/path/to/lua-resty-csp/lib/?.lua;;";

server {
    listen 8080;
    server_name localhost;

    location / {
        content_by_lua_block {
            local csp = require("resty.csp")
            local nonce, err = csp.generate_nonce()
            if not nonce then
                ngx.log(ngx.ERR, "csp nonce: ", err)
                return ngx.exit(500)
            end
            ngx.ctx.csp_nonce = nonce

            ngx.header.content_type = "text/html; charset=utf-8"
            ngx.say(([[<!doctype html>
<html><body>
<script nonce="%s">console.log("allowed by csp nonce")</script>
</body></html>]]):format(nonce))
        }

        header_filter_by_lua_block {
            local csp = require("resty.csp")
            local nonce = ngx.ctx.csp_nonce
            if not nonce then
                return
            end

            csp.new()
                :default_src(csp.SELF)
                :script_src(csp.nonce(nonce), csp.STRICT_DYNAMIC)
                :style_src(csp.SELF)
                :img_src(csp.SELF, csp.DATA)
                :object_src(csp.NONE)
                :base_uri(csp.SELF)
                :frame_ancestors(csp.NONE)
                :apply()
        }
    }

    location = /csp-report {
        content_by_lua_block {
            require("resty.csp").report_handler(function(report)
                ngx.log(ngx.WARN, "csp violated: ",
                    tostring(report["violated-directive"]))
            end)()
        }
    }
}
